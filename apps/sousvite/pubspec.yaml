name: sousvite
description: Recipes, nutrition, and a smart cooking mode in one app.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  clock: any
  cloud_functions: ^7.0.1
  collection: any
  data: any
  design_system: any
  domain: any
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  firebase_app_check: ^0.5.2
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  http: ^1.6.0
  ingredient_parser: any
  intl: any
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.11.0
  measuring: any
  nutrition: any
  recipe_import: any
  riverpod_annotation: ^4.0.8
  sentry_flutter: ^10.4.0
  sync: any
  uuid: ^4.5.1
  wakelock_plus: ^1.3.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
