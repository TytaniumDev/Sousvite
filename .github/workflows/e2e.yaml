name: End-to-end

# Runs the end-to-end flows in apps/sousvite/integration_test (ENGINEERING.md
# §15) against the real app with an in-memory cloud, so no Firebase project
# or credentials are needed. ci.yml calls this workflow on every pull request
# and push: once in Chrome, and on Flutter's headless test device at a small
# phone and a tablet size, where the layouts differ most. The headless runs
# use native SQLite and take about a minute; an Android emulator took 5 to
# 15, so it only ran after merging and broke main (Tyler, 2026-11-19). The
# Release workflow still proves the Android app builds.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: End-to-end (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🚗 Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: 🧪 Run the flows in Chrome
        working-directory: apps/sousvite
        run: |
          chromedriver --port=4444 &
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server --browser-name=chrome \
            --web-browser-flag=--headless=new

  headless:
    name: End-to-end (${{ matrix.screen.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        screen:
          # The smallest phone we support, with the system bars taken off.
          - name: phone
            size: 320x568
          # A landscape tablet, wide enough for side panes.
          - name: tablet
            size: 1280x800
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🧪 Run the flows
        working-directory: apps/sousvite
        run: |
          flutter test integration_test/app_test.dart -d flutter-tester \
            --dart-define=E2E_NO_WAKELOCK=true \
            --dart-define=E2E_SCREEN_SIZE=${{ matrix.screen.size }}
